map $http_upgrade $ktga_connection_upgrade {
    default upgrade;
    '' '';
}
upstream ktga_backend {
    server 127.0.0.1:4000;
    keepalive 256;
}
# Query strings can contain verification or parental tokens: never log them.
log_format ktga_public '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
