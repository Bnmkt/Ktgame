server {
    listen 80;
    listen [::]:80;
    server_name www.ktga.me ktga.me api.ktga.me;
    access_log /var/log/nginx/ktga-access.log ktga_public;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ktga.me;
    ssl_certificate /etc/letsencrypt/live/ktga.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ktga.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/ktga-access.log ktga_public;
    return 308 https://www.ktga.me$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.ktga.me;
    root /var/www/ktga;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/ktga.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ktga.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log /var/log/nginx/ktga-access.log ktga_public;
    error_log /var/log/nginx/ktga-error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'sha256-rN7g649vD1eaoSa3Den176OMNLGfI8ZAXi7TSlAImxU=' https://www.googletagmanager.com; frame-src https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.ktga.me wss://api.ktga.me https://www.googletagmanager.com https://*.google-analytics.com" always;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location ~ /\. { deny all; }
    location = /ktga { return 308 /$is_args$args; }
    location /ktga/ { rewrite ^/ktga/(.*)$ /$1 permanent; }
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
    }
    location ~* \.(?:png|jpe?g|webp|gif|svg|ico|woff2?|css|js|map)$ {
        try_files $uri =404;
    }
    location / {
        proxy_pass http://ktga_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection $ktga_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_read_timeout 30s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.ktga.me;
    ssl_certificate /etc/letsencrypt/live/ktga.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ktga.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log /var/log/nginx/ktga-access.log ktga_public;
    error_log /var/log/nginx/ktga-error.log warn;
    client_max_body_size 4m;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass http://ktga_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ktga_connection_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
}
