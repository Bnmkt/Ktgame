# Bootstrap only: obtain the certificate before switching to nginx-https.conf.
server {
    listen 80;
    listen [::]:80;
    server_name www.ktga.me ktga.me api.ktga.me;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 503; }
}
