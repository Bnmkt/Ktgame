daemon off;
worker_processes 2;
worker_rlimit_nofile 65536;
pid nginx.pid;
error_log nginx-error.log warn;

events { worker_connections 8192; }

http {
    access_log off;
    client_body_temp_path client-body;
    proxy_temp_path proxy-body;
    map $http_upgrade $capacity_upgrade { default upgrade; '' ''; }
    upstream capacity_backend { server 127.0.0.1:4103; keepalive 256; }
    server {
        listen 127.0.0.1:4104;
        server_name localhost;
        client_max_body_size 4m;
        location / {
            proxy_pass http://capacity_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $capacity_upgrade;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_buffering off;
        }
    }
}
